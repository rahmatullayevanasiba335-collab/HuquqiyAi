<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuquqiyAI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #172033;
    }

    header {
      background: #172a4d;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 15px;
      box-sizing: border-box;
      border: 1px solid #ccd2dc;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #answer {
      margin-top: 20px;
      padding: 15px;
      background: #eef4ff;
      border-radius: 10px;
      display: none;
      line-height: 1.6;
    }

    .warning {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>⚖️ HuquqiyAI</h1>
  <p>Huquqiy savollaringizga sun’iy intellekt yordamida javob oling</p>
</header>

<div class="container">
  <div class="card">

    <h2>Huquqiy savolingizni yozing</h2>

    <textarea id="question"
      placeholder="Masalan: Mehnat shartnomasini ish beruvchi bekor qilishi mumkinmi?">
    </textarea>

    <button onclick="getAnswer()">
      🔍 Javob olish
    </button>

    <div id="answer"></div>

    <div class="warning">
      ⚠️ HuquqiyAI ma’lumot beruvchi yordamchi hisoblanadi.
      Muhim huquqiy masalalarda malakali yuristga murojaat qiling.
    </div>

  </div>
</div>

<script>
function getAnswer() {

  let question = document.getElementById("question").value.trim();
  let answer = document.getElementById("answer");

  if (question === "") {
    answer.style.display = "block";
    answer.innerHTML = "❗ Iltimos, huquqiy savolingizni yozing.";
    return;
  }

  answer.style.display = "block";

  answer.innerHTML =
    "<b>HuquqiyAI:</b><br><br>" +
    "Savolingiz qabul qilindi. Ushbu tizimning keyingi " +
    "bosqichida O‘zbekiston Respublikasi qonunchiligi " +
    "asosida sun’iy intellekt yordamida batafsil javob " +
    "berish funksiyasi ulanadi.";
}
</script>

</body>
</html>
