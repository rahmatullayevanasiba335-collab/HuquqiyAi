<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huquqiy AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #172033;
    }

    header {
      background: #123b6d;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 15px;
      color: #123b6d;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      padding: 15px;
      border: 1px solid #ccd5e0;
      border-radius: 10px;
      resize: vertical;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #123b6d;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #123b6d;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #0d2d54;
    }

    #answer {
      margin-top: 20px;
      padding: 18px;
      background: #f0f4f8;
      border-radius: 10px;
      min-height: 80px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .warning {
      margin-top: 15px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>⚖️ Huquqiy AI</h1>
    <p>Huquqiy savollaringizga sun'iy intellekt yordamida javob oling</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>Huquqiy savolingizni yozing</h2>

      <textarea
        id="question"
        placeholder="Masalan: Mehnat shartnomasi bekor qilinsa, xodimning qanday huquqlari bor?"
      ></textarea>

      <button onclick="askAI()">
        🤖 Javob olish
      </button>

      <div id="answer">
        Javob shu yerda chiqadi...
      </div>

      <p class="warning">
        ⚠️ Ushbu AI javobi umumiy ma'lumot uchun. Aniq huquqiy holat bo'yicha
        malakali yurist bilan maslahatlashish tavsiya etiladi.
      </p>
    </div>

  </div>

  <script>
    async function askAI() {

      const question = document.getElementById("question").value.trim();
      const answer = document.getElementById("answer");

      if (!question) {
        answer.innerText = "Iltimos, huquqiy savolingizni yozing.";
        return;
      }

      answer.innerText = "⏳ Javob tayyorlanmoqda...";

      try {

        const response = await fetch("/api/chat", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            question: question
          })
        });

        const data = await response.json();

        if (data.answer) {
          answer.innerText = data.answer;
        } else if (data.error) {
          answer.innerText = "Xatolik: " + data.error;
        } else {
          answer.innerText = "Javob olishda xatolik yuz berdi.";
        }

      } catch (error) {

        answer.innerText =
          "Server bilan bog'lanishda xatolik yuz berdi.";

        console.error(error);
      }
    }
  </script>

</body>
</html>
