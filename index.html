    <!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuquqiyAI — LexUZ</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #172033;
    }

    header {
      background: #172a4d;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    .container {
      max-width: 700px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    textarea {
      width: 100%;
      height: 140px;
      box-sizing: border-box;
      padding: 15px;
      border: 1px solid #ccd2dc;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
    }

    #answer {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #eef4ff;
      border-radius: 10px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .source {
      margin-top: 15px;
      font-size: 14px;
    }

    .source a {
      color: #2563eb;
    }
  </style>
</head>

<body>

<header>
  <h1>⚖️ HuquqiyAI</h1>
  <p>LexUZ qonunchiligi asosida huquqiy yordamchi</p>
</header>

<div class="container">
  <div class="card">

    <h2>Huquqiy savolingizni yozing</h2>

    <textarea
      id="question"
      placeholder="Masalan: Ish beruvchi xodimni qaysi hollarda ishdan bo‘shatishi mumkin?">
    </textarea>

    <button onclick="getAnswer()">
      🔍 LexUZ asosida javob olish
    </button>

    <div id="answer"></div>

  </div>
</div>

<script>

async function getAnswer() {

  const question =
    document.getElementById("question").value.trim();

  const answer =
    document.getElementById("answer");

  if (!question) {
    answer.style.display = "block";
    answer.innerText =
      "❗ Iltimos, huquqiy savolingizni yozing.";
    return;
  }

  answer.style.display = "block";
  answer.innerText =
    "⏳ LexUZ qonunchiligidan ma'lumot izlanmoqda...";

  try {

    const response = await fetch(
      "https://muddy-heart-619a.rahmatullayevanasiba335.workers.dev/",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          question: question
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {

      answer.innerText =
        "❌ Xatolik:\n\n" +
        (data.error || "Server xatosi");

      return;
    }

    answer.innerText =
      "⚖️ HuquqiyAI\n\n" +
      (data.answer || "Javob topilmadi.");

    if (data.source) {

      answer.innerHTML +=
        "\n\n📚 Manba: " +
        data.source;
    }

  } catch (error) {

    answer.innerText =
      "❌ Server bilan bog‘lanib bo‘lmadi.";

  }
}

</script>

</body>
</html>
